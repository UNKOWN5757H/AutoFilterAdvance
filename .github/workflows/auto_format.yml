name: Auto Lint & Auto-Correct

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  flake8:
    name: Flake8 Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 . \
            --count \
            --max-complexity=10 \
            --max-line-length=120 \
            --statistics || true

  auto_format:
    name: Auto Format
    needs: flake8
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Formatters
        run: |
          python -m pip install --upgrade pip
          pip install black isort

      - name: Run isort
        run: isort .

      - name: Run black
        run: black .

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi

          git commit -m "style: auto-format code [skip ci]"
          git push
